<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iRec · Tutorial TOTP</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@hyperframes/player"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #090b0f; }
    body {
      display: grid;
      place-items: center;
      padding: 12px;
      color: #f4f5f7;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    main { width: min(100%, 440px); }
    .embedded-head { margin-bottom: 10px; }
    .embedded-head strong { display:block; font-size:14px; }
    .embedded-head span { display:block; margin-top:3px; color:#929eaf; font-size:11px; line-height:1.45; }
    hyperframes-player {
      display:block; width:100%; aspect-ratio:9/16; overflow:hidden;
      border:1px solid #2c3340; border-radius:18px; background:#11151d;
    }
    .fallback { margin:10px 0 0; color:#7f8ba0; font-size:10px; line-height:1.4; }
    a { color:#d9ff6f; }
  </style>
</head>
<body>
  <main>
    <div class="embedded-head">
      <strong>Google Authenticator → iRec</strong>
      <span>Instalar, escanear el QR, copiar los 6 dígitos y guardar recovery codes.</span>
    </div>
    <hyperframes-player
      src="/tutorials/totp-onboarding/index.html"
      controls
    ></hyperframes-player>
    <p class="fallback">
      Si el reproductor no carga,
      <a href="/tutorials/totp-onboarding/index.html?autoplay=1">reproduce la composición HTML</a>.
    </p>
  </main>
</body>
</html>
