server {
  listen 80;
  server_name _;

  # 100MB app limit + multipart overhead. The API streams uploads to Drive
  # via resumable 8MB chunk PUTs, so proxy buffering stays enabled
  # (default): nginx may spool large bodies to disk while the API pipes
  # them with constant memory — do NOT disable proxy_request_buffering.
  client_max_body_size 110M;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /api/ {
    # Same 100MB + overhead budget at the upload path: without this,
    # nginx answers 413 HTML before the API can return JSON.
    client_max_body_size 110M;
    proxy_pass http://irec-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
