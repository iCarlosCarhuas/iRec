services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: irec
      POSTGRES_USER: irec
      POSTGRES_PASSWORD: irec_dev
    ports:
      - "5432:5432"
    volumes:
      - irec_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irec -d irec"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - irec_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  irec_postgres:
  irec_redis:
